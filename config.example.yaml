# Copy to config.yaml and tune for your operation.
# Longer phrases are replaced first (strains, companies, people).

strains:
  - "Blue Dream"
  - "Wedding Cake"

companies:
  - "Example Cultivation LLC"
  - "Sample Processing Inc."

people:
  - "Jane Q. Patient"

# Extra regexes after built-ins: { pattern } — matches become [EXTRA_n] (mapping stores original).
extra_patterns:
  - pattern: "\\bCUSTOM-\\d{4,}\\b"

# Built-in redactors (set false to disable)
builtins:
  credit_card: true
  ssn: true
  ein: true
  email: true
  phone_us: true
  date_iso: true
  date_us_slash: true
  ipv6: true
  ipv4: true
  # METRC-style package / tag tokens (20–28 uppercase alphanumerics)
  metrc_like_ids: true
